<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ether Cloud | Magic Login</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;500;700&display=swap');

        :root {
            --glass: rgba(255, 255, 255, 0.8);
            --accent: #6366f1;
            --text-main: #1e293b;
        }

        body {
            margin: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: linear-gradient(135deg, #e0e7ff 0%, #f3e8ff 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-main);
        }

        .glass-card {
            background: var(--glass);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.4);
            border-radius: 32px;
            padding: 40px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.1);
            transition: transform 0.3s ease;
        }

        h1 { font-weight: 700; font-size: 1.8rem; letter-spacing: -0.5px; margin-bottom: 8px; }
        p { color: #64748b; margin-bottom: 24px; font-size: 0.9rem; line-height: 1.5; }

        /* Input Styling */
        .input-group { margin-bottom: 16px; text-align: left; }
        input[type="email"] {
            width: 100%;
            padding: 14px 18px;
            border-radius: 14px;
            border: 1px solid #cbd5e1;
            background: white;
            font-family: inherit;
            font-size: 1rem;
            box-sizing: border-box;
            outline: none;
            transition: border-color 0.2s;
        }
        input[type="email"]:focus { border-color: var(--accent); box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.1); }

        .btn {
            background: #0f172a;
            color: white;
            padding: 14px;
            border-radius: 14px;
            border: none;
            font-weight: 600;
            width: 100%;
            cursor: pointer;
            font-size: 1rem;
            transition: all 0.2s;
        }
        .btn:hover { background: #1e293b; transform: translateY(-1px); }
        .btn:active { transform: translateY(0); }

        /* App UI */
        #app-ui { display: none; }
        .upload-area {
            border: 2px dashed #cbd5e1;
            padding: 40px 20px;
            border-radius: 20px;
            margin: 20px 0;
            cursor: pointer;
            background: rgba(255,255,255,0.4);
        }
        .file-item {
            background: white;
            padding: 12px;
            border-radius: 12px;
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
            font-size: 0.85rem;
        }

        .status-msg { font-size: 0.85rem; margin-top: 12px; font-weight: 500; }
        .hidden { display: none; }
    </style>
</head>
<body>

    <div class="glass-card">
        <div id="auth-ui">
            <h1>Ether Cloud</h1>
            <p>Enter your email. We'll send a magic link to your inbox—no password required.</p>
            
            <div class="input-group">
                <input type="email" id="email" placeholder="name@example.com">
            </div>
            <button class="btn" id="magicLinkBtn" onclick="sendMagicLink()">Send Magic Link</button>
            <div id="authStatus" class="status-msg"></div>
        </div>

        <div id="app-ui">
            <h1>Welcome back</h1>
            <p id="user-display" style="margin-bottom: 10px; font-weight: 600;"></p>
            
            <div class="upload-area" onclick="document.getElementById('fileInput').click()">
                <span id="upload-status">Drop file or click to upload</span>
                <input type="file" id="fileInput" class="hidden" onchange="uploadFile(event)">
            </div>

            <div id="file-list"></div>
            
            <button class="btn" style="background:none; color:#ef4444; margin-top:20px; border: 1px solid #fee2e2" onclick="signOut()">Log Out</button>
        </div>
    </div>

    <script>
        // REPLACE THESE WITH YOUR KEYS FROM SUPABASE SETTINGS > API
        const SUPABASE_URL = 'YOUR_SUPABASE_URL';
        const SUPABASE_KEY = 'YOUR_SUPABASE_ANON_KEY';
        
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        // --- MAGIC LINK LOGIC ---
        async function sendMagicLink() {
            const email = document.getElementById('email').value;
            const btn = document.getElementById('magicLinkBtn');
            const status = document.getElementById('authStatus');

            if (!email) return alert("Please enter your email");

            btn.disabled = true;
            btn.innerText = "Sending...";

            const { error } = await supabaseClient.auth.signInWithOtp({
                email: email,
                options: {
                    emailRedirectTo: window.location.href, // Sends user back to this exact page
                },
            });

            if (error) {
                status.style.color = "#ef4444";
                status.innerText = error.message;
                btn.disabled = false;
                btn.innerText = "Send Magic Link";
            } else {
                status.style.color = "#059669";
                status.innerText = "Check your email for the login link!";
            }
        }

        // --- AUTH STATE TRACKER ---
        supabaseClient.auth.onAuthStateChange((event, session) => {
            if (session) {
                document.getElementById('auth-ui').style.display = 'none';
                document.getElementById('app-ui').style.display = 'block';
                document.getElementById('user-display').innerText = session.user.email;
                loadFiles();
            }
        });

        async function signOut() {
            await supabaseClient.auth.signOut();
            window.location.reload();
        }

        // --- STORAGE LOGIC ---
        async function uploadFile(event) {
            const file = event.target.files[0];
            if (!file) return;

            const status = document.getElementById('upload-status');
            status.innerText = "Uploading...";

            // Uploading to the 'files' bucket
            const { data, error } = await supabaseClient.storage
                .from('files')
                .upload(`${Date.now()}_${file.name}`, file);

            if (error) {
                alert("Upload failed: " + error.message);
                status.innerText = "Drop file or click to upload";
            } else {
                status.innerText = "Upload Complete!";
                setTimeout(() => {
                    status.innerText = "Drop file or click to upload";
                    loadFiles();
                }, 2000);
            }
        }

        async function loadFiles() {
            const listContainer = document.getElementById('file-list');
            listContainer.innerHTML = '<p style="font-size:0.8rem">Loading files...</p>';

            const { data, error } = await supabaseClient.storage.from('files').list('', {
                limit: 10,
                offset: 0,
                sortBy: { column: 'created_at', order: 'desc' },
            });

            if (data) {
                listContainer.innerHTML = '';
                data.forEach(file => {
                    const { data: urlObj } = supabaseClient.storage.from('files').getPublicUrl(file.name);
                    
                    const div = document.createElement('div');
                    div.className = 'file-item';
                    div.innerHTML = `
                        <span style="overflow:hidden; text-overflow:ellipsis; white-space:nowrap; max-width:200px">${file.name.split('_')[1] || file.name}</span>
                        <a href="${urlObj.publicUrl}" target="_blank" style="color:var(--accent); text-decoration:none; font-weight:600">View</a>
                    `;
                    listContainer.appendChild(div);
                });
            }
        }
    </script>
</body>
</html>
